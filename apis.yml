name: Envelop Risk
description: 'Envelop Risk is a technology-led reinsurance underwriting and analytics
  firm specializing in cyber and other complex, emerging risks. The company combines
  actuarial science, machine learning, and cyber threat intelligence to model, price,
  and underwrite cyber (re)insurance for insurers, MGAs, and capital-market partners.
  Its platforms include CyberTooth (cyber risk modeling and augmented underwriting),
  Cyber Threat Intelligence, Envelop Capital Markets, and Envelop Risk Solutions
  (product development, analytics, modeling support). Backed by SoftBank Vision Fund,
  Envelop Risk surpassed a $1bn gross-written-premium milestone. This API Evangelist
  profile was created as a portfolio-company lead; the company does not publish a
  public developer portal, API, or SDKs at this time.'
